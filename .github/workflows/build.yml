name: Build

on:
  push:
    branches:
      - main
      - feature/**
    tags:
      - v*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release

jobs:
  build-test:
    runs-on: windows-latest
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # A tag must match the built version and have release notes before anything is built.
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseVersion.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Restore
        run: dotnet restore AppleMusicLyrics.sln

      - name: Build
        run: dotnet build AppleMusicLyrics.sln -c $env:CONFIGURATION --no-restore

      - name: Verify formatting
        run: dotnet format AppleMusicLyrics.sln --verify-no-changes --severity warn --no-restore

      - name: Test
        run: dotnet test AppleMusicLyrics.sln -c $env:CONFIGURATION --no-build -v minimal --collect:"Code Coverage" --results-directory .\artifacts\test-results

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: artifacts/test-results/
          if-no-files-found: warn

      - name: Publish WPF App
        run: ./build.ps1

      - name: Create Release Zip
        id: package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF.Substring(10)
          }
          else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $zipName = "AppleMusicLyrics-$version-win-x64.zip"
          $zipPath = ".\artifacts\$zipName"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Copy-Item LICENSE, README.md, RELEASE_NOTES.md -Destination .\artifacts\publish\win-x64
          Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath $zipPath
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Test the file users download: its contents, and that the extracted app starts.
      - name: Check release package
        shell: pwsh
        run: ./.github/scripts/Test-ReleasePackage.ps1 -ZipPath "./artifacts/${{ steps.package.outputs.zip_name }}"

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusicLyrics-win-x64
          path: artifacts/${{ steps.package.outputs.zip_name }}

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # One release run per tag at a time.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release notes and scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE_NOTES.md
            .github/scripts
          sparse-checkout-cone-mode: false

      # The release body is what the in-app updater shows: this tag's section of RELEASE_NOTES.md.
      - name: Extract release notes
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## " tag || index($0, "## " tag " ") == 1 { found = 1; next }
            found && (/^## / || /^---$/) { exit }
            found { print }
          ' RELEASE_NOTES.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::RELEASE_NOTES.md has no section for $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: AppleMusicLyrics-win-x64
          path: artifacts

      # The upload action reuses an existing release as it is: re-running a published tag would
      # replace the file users download before the digest check below. Only a draft continues.
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
        # This endpoint returns only published releases: 404 means none (a draft may continue);
        # any other failure stops the release rather than guessing.
        run: |
          set +e
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1)
          set -e
          status=$(printf '%s\n' "$response" | sed -n '1s/^HTTP\/[0-9.]* \([0-9][0-9]*\).*/\1/p')
          case "$status" in
            404) echo "No published release for $GITHUB_REF_NAME yet." ;;
            200) echo "::error::Release $GITHUB_REF_NAME is already published. Tag a new version instead of re-running."; exit 1 ;;
            *) echo "::error::Could not check for an existing release (status '${status:-none}')."; printf '%s\n' "$response" | head -20; exit 1 ;;
          esac

      # Upload as a draft first: users only see the release once the uploaded file is verified.
      - name: Create draft GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: AppleMusicLyrics ${{ github.ref_name }}
          files: artifacts/${{ needs.build-test.outputs.zip_name }}
          body_path: release-notes.md
          draft: true
          # A tag such as v1.0.0-rc.1 is a pre-release, which /releases/latest never returns.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false

      - name: Verify the uploaded package digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/Test-ReleaseAssetDigest.ps1
          -Repository $env:GITHUB_REPOSITORY
          -ReleaseId "${{ steps.release.outputs.id }}"
          -ZipPath "artifacts/${{ needs.build-test.outputs.zip_name }}"

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}"
          -F draft=false
          -f make_latest=${{ contains(github.ref_name, '-') && 'false' || 'true' }}
